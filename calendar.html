<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Calendar - Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <nav id="navbar"></nav>

    <main class="mx-auto max-w-2xl space-y-6 p-4">
      <h1 class="text-2xl font-bold">Calendar</h1>

      <form id="date-form" class="rounded-lg border border-zinc-800 bg-zinc-900 p-4">
        <label class="flex flex-col gap-1 text-sm text-zinc-400">
          Date
          <input
            id="date"
            type="date"
            required
            class="w-full rounded border border-zinc-700 bg-zinc-800 px-3 py-2 text-zinc-100 focus:border-red-500 focus:outline-none"
          />
        </label>
      </form>

      <section class="space-y-3">
        <div>
          <h2 id="heading" class="text-xl font-semibold"></h2>
          <p id="summary" class="text-sm text-zinc-400"></p>
        </div>
        <div id="records" class="space-y-2"></div>
      </section>
    </main>

    <script type="module" src="js/calendar.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Habit - Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <nav id="navbar"></nav>

    <main class="mx-auto max-w-5xl space-y-6 p-4">
      <p id="not-found" class="hidden rounded-lg border border-zinc-800 bg-zinc-900 p-4 text-zinc-400">
        Habit not found.
        <a href="index.html" class="text-red-400 underline">Back to dashboard</a>
      </p>

      <div id="content" class="hidden space-y-6">
        <header class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h1 id="habit-name" class="text-2xl font-bold"></h1>
            <p id="habit-description" class="text-zinc-400"></p>
          </div>
          <div class="flex flex-wrap gap-2">
            <a id="add-record" class="inline-block rounded bg-red-600 px-4 py-2 font-medium text-white hover:bg-red-500">
              Add record
            </a>
            <a id="edit-habit" class="inline-block rounded border border-zinc-700 px-4 py-2 hover:bg-zinc-800">Edit</a>
            <button id="delete-habit" class="inline-block rounded border border-red-800 px-4 py-2 text-red-400 hover:bg-red-950">
              Delete
            </button>
          </div>
        </header>

        <section class="space-y-3 rounded-lg border border-zinc-800 bg-zinc-900 p-4">
          <h2 class="font-semibold">Filters</h2>
          <div class="grid gap-3 sm:grid-cols-2">
            <label class="flex flex-col gap-1 text-sm text-zinc-400">
              Start date
              <input
                id="start"
                type="date"
                class="w-full rounded border border-zinc-700 bg-zinc-800 px-3 py-2 text-zinc-100 focus:border-red-500 focus:outline-none"
              />
            </label>
            <label class="flex flex-col gap-1 text-sm text-zinc-400">
              End date
              <input
                id="end"
                type="date"
                class="w-full rounded border border-zinc-700 bg-zinc-800 px-3 py-2 text-zinc-100 focus:border-red-500 focus:outline-none"
              />
            </label>
          </div>
        </section>

        <section id="stats"></section>

        <section id="charts" class="grid gap-4 md:grid-cols-2">
          <div class="relative min-w-0 rounded-lg border border-zinc-800 bg-zinc-900 p-4">
            <h2 class="mb-2 font-semibold">Scores over time</h2>
            <canvas id="trend-chart"></canvas>
          </div>
          <div class="relative min-w-0 rounded-lg border border-zinc-800 bg-zinc-900 p-4">
            <h2 class="mb-2 font-semibold">Score distribution</h2>
            <canvas id="dist-chart"></canvas>
          </div>
        </section>

        <section class="space-y-3">
          <h2 class="text-xl font-semibold">Records</h2>
          <div id="record-list" class="space-y-2"></div>
        </section>
      </div>
    </main>

    <script type="module" src="js/habit.js"></script>
  </body>
</html>

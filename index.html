<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Dashboard - Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <nav id="navbar"></nav>

    <main class="mx-auto max-w-5xl space-y-6 p-4">
      <header class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-2xl font-bold">Dashboard</h1>
        <a href="add-habit.html" class="inline-block rounded bg-red-600 px-4 py-2 font-medium text-white hover:bg-red-500">
          Add habit
        </a>
      </header>

      <section class="space-y-3 rounded-lg border border-zinc-800 bg-zinc-900 p-4">
        <h2 class="font-semibold">Filters</h2>
        <div id="habit-filters" class="flex flex-wrap gap-2"></div>
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="flex flex-col gap-1 text-sm text-zinc-400">
            Start date
            <input
              id="start"
              type="date"
              class="w-full rounded border border-zinc-700 bg-zinc-800 px-3 py-2 text-zinc-100 focus:border-red-500 focus:outline-none"
            />
          </label>
          <label class="flex flex-col gap-1 text-sm text-zinc-400">
            End date
            <input
              id="end"
              type="date"
              class="w-full rounded border border-zinc-700 bg-zinc-800 px-3 py-2 text-zinc-100 focus:border-red-500 focus:outline-none"
            />
          </label>
        </div>
      </section>

      <section id="stats"></section>

      <section id="charts" class="space-y-4">
        <div class="relative min-w-0 rounded-lg border border-zinc-800 bg-zinc-900 p-4">
          <h2 class="mb-2 font-semibold">Scores over time</h2>
          <canvas id="trend-chart"></canvas>
        </div>
        <div class="grid gap-4 md:grid-cols-2">
          <div class="relative min-w-0 rounded-lg border border-zinc-800 bg-zinc-900 p-4">
            <h2 class="mb-2 font-semibold">Mean score by habit</h2>
            <canvas id="mean-chart"></canvas>
          </div>
          <div class="relative min-w-0 rounded-lg border border-zinc-800 bg-zinc-900 p-4">
            <h2 class="mb-2 font-semibold">Score distribution</h2>
            <canvas id="dist-chart"></canvas>
          </div>
        </div>
      </section>

      <section class="space-y-3">
        <h2 class="text-xl font-semibold">Habits</h2>
        <div id="habit-list" class="grid gap-3 sm:grid-cols-2"></div>
      </section>
    </main>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
